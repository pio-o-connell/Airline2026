
name: Airline Playwright Tests

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  playwright:
    name: PHP, MySQL and Playwright
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:5.7.44
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_ROOT_HOST: "%"
          MYSQL_DATABASE: airline2026
        ports:
          - 3307:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -proot"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10

    env:
      CI: true
      AIRLINE_DB_HOST: 127.0.0.1
      AIRLINE_DB_PORT: 3307
      AIRLINE_DB_NAME: airline2026
      AIRLINE_DB_USER: root
      AIRLINE_DB_PASSWORD: root
      STRIPE_SECRET_KEY: ${{ secrets.STRIPE_SECRET_KEY }}

    steps:
      - uses: actions/checkout@v5

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: pdo_mysql
          coverage: none

      # Install PHP dependencies and generate vendor/autoload.php.
      - name: Install Composer dependencies
        run: composer install --no-interaction --prefer-dist

      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: npm

      - name: Install MySQL client
        run: |
          sudo apt-get update
          sudo apt-get install -y mysql-client

      - name: Wait for MySQL
        run: |
          until mysqladmin ping -h 127.0.0.1 -P 3307 -uroot -proot --silent; do
            sleep 2
          done

      - name: Create CI database
        run: mysql -h 127.0.0.1 -P 3307 -uroot -proot < airline2026.sql

      - name: Install Node dependencies
        run: npm ci

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      # Prepare the directory for Playwright's JSON report.
      - name: Prepare Playwright report directory
        run: mkdir -p test-results

      # Run tests and generate HTML and JSON reports.
      - name: Run Playwright tests
        run: npx playwright test --workers=1 --reporter=list,html,json
        env:
          PLAYWRIGHT_JSON_OUTPUT_NAME: test-results/results.json

      # Display the test results directly on the GitHub Actions summary page.
      - name: Add test results to GitHub summary
        if: always()
        run: |
          node --input-type=module <<'NODE'
          import { appendFileSync, existsSync, readFileSync } from 'node:fs';

          // Check whether Playwright generated its JSON report.
          const reportPath = 'test-results/results.json';
          const summaryPath = process.env.GITHUB_STEP_SUMMARY;

          if (!existsSync(reportPath)) {
            appendFileSync(
              summaryPath,
              '## Airline2026 Test Results\n\nThe JSON report was not generated. Check the test step for errors.\n'
            );
            process.exit(0);
          }

          // Read the test counts from Playwright's JSON report.
          const report = JSON.parse(readFileSync(reportPath, 'utf8'));
          const stats = report.stats ?? {};

          const passed = Number(stats.expected ?? 0);
          const failed = Number(stats.unexpected ?? 0);
          const flaky = Number(stats.flaky ?? 0);
          const skipped = Number(stats.skipped ?? 0);
          const total = passed + failed + flaky + skipped;
          const duration = (Number(stats.duration ?? 0) / 1000).toFixed(1);
          const categoryNames = ['SMK', 'FUN', 'INT', 'REG', 'SEC', 'RSP', 'E2E'];
          const categoryCounts = Object.fromEntries(
            categoryNames.map((category) => [category, 0])
          );
          const failedTests = [];

          // Walk nested Playwright suites and use the explicit title tags for
          // category totals and failure identifiers.
          const visitSuite = (suite) => {
            for (const spec of suite.specs ?? []) {
              const title = spec.title ?? '';
              for (const category of categoryNames) {
                if (title.includes(`@${category}`)) {
                  categoryCounts[category] += 1;
                }
              }

              for (const test of spec.tests ?? []) {
                if (test.status === 'unexpected') {
                  failedTests.push(title);
                }
              }
            }
            for (const childSuite of suite.suites ?? []) {
              visitSuite(childSuite);
            }
          };

          for (const suite of report.suites ?? []) {
            visitSuite(suite);
          }

          // Determine the overall test result.
          const result = failed > 0
            ? '❌ Failed'
            : flaky > 0
              ? '⚠️ Passed with flaky tests'
              : '✅ Passed';

          // Write a compact results table to the GitHub Actions summary.
          const summaryLines = [
            '## Airline2026 Playwright Test Results',
            '',
            `**Overall result:** ${result}`,
            '',
            '| Total | Passed | Failed | Flaky | Skipped | Duration |',
            '|---:|---:|---:|---:|---:|---:|',
            `| ${total} | ${passed} | ${failed} | ${flaky} | ${skipped} | ${duration}s |`,
            '',
            '### Category inventory',
            '',
            '| Category | Tests |',
            '|---|---:|',
            ...categoryNames.map((category) => `| @${category} | ${categoryCounts[category]} |`),
            ''
          ];

          if (failedTests.length > 0) {
            summaryLines.push(
              '### Failed test identifiers',
              '',
              ...failedTests.map((testTitle) => `- ${testTitle}`),
              ''
            );
          }

          appendFileSync(summaryPath, summaryLines.join('\n'));
          NODE

      # Retain the downloadable HTML report and test results.
      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: airline-playwright-report
          path: |
            playwright-report/
            test-results/
          if-no-files-found: ignore
